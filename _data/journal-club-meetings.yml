- date: "April 24, 2026 (Friday), 10 am-11 am"
  description: "Paper Discussion: Bethke et al. (2025). IDLaS-DE – A Web-Based Platform for Running Customized Studies on Individual Differences in German Language Skills. http://doi.org/10.5334/joc.468. Moderated by *Dr Xenia Schmalz (Technische Universität Darmstadt)*."

- date: "March 24, 2026 (Tuesday), 11 am-12 pm"
  description: "Guest Talk by Dr. Daria Kostanian (Sirius University of Science and Technology), \"Development of coarse- and orientation-tuning for native letters in children\""
  abstract: "We investigated neurophysiological letter coding in typically developing children (3.6—9.3 years) using an oddball fast periodic visual stimulation. By measuring neural discrimination responses to non-native (Georgian) letters embedded in streams of native (Russian) letters, it was found that even pre-readers show automatic discrimination of native from foreign scripts. In contrast, sensitivity to the standard orientation of native letters, as measured by the detection of inverted letters among upright Russian letters, emerged only after the onset of reading instruction and increased with age. These findings reveal two distinct trajectories in visual letter tuning: an early-emerging, coarse tuning driven by environmental exposure, and a more fine orientation tuning that depends on active reading acquisition."

- date: "March 6, 2026 (Friday), 11 am-12 pm"
  description: "Guest Talk by Prof. Katharina von Kriegstein (TU Dresden), \"The role of sensory thalami and cortico-thalamic connections in developmental dyslexia\"."
  abstract: "Developmental dyslexia is a specific reading disorder with a high prevalence. It often has a substantial impact on the psychosocial well-being and academic achievement of affected individuals. Contemporary research characterizes developmental dyslexia as a multifactorial condition with phonological processing difficulties playing a central role. Neuroscientific research focuses often on explaining developmental dyslexia at the level of the cerebral cortex. However, this cortical focus leaves potential contributions from subcortical structures largely unexplained, particularly those of the sensory thalamus. In this talk, I will first summarize our work on the role of the auditory and visual sensory thalami, namely the medial geniculate body (MGB) and the lateral geniculate nucleus (LGN) in phonological and visual speech processing. I will then show that developmental dyslexia is characterised by alterations in these structures and that these alterations are related to key symptoms of developmental dyslexia."

- date: "Januray 21, 2026 (Wednesday), 9 am-10 am"
  description: "Guest Talk by Dr. Kurt Winsler (UC Davis), \"Experience-dependent Changes in the Visual Processing of Letters: Evidence from Electroencephalography Decoding\"."
  abstract: "Learning to read involves the formation and tuning of letter representations, but it is unknown whether this orthographic tuning influences very early visual processing or only later processing. I will talk about a study which tested the hypothesis that experience increases the extraction of sensory information about letters by comparing the EEG activity elicited by upright and inverted letters. In a set of conventional univariate analyses, we found that inverted letters elicited larger P1 amplitudes (starting ca. 110 msec) and larger N170 amplitudes (starting ca.160 msec) compared with upright letters. These larger amplitudes could reflect enhanced processing, but they might instead reflect degraded processing. We therefore performed multivariate pattern classification (decoding) to assess the amount of information about letter identity in the neural signal. Specifically, we decoded which individual letter was presented from the pattern of voltage across the scalp at each time point. We found that decoding accuracy was greater for upright letters than for inverted letters during the P1 latency range (starting ca. 90 msec), particularly in electrodes over the left hemisphere and for letters presented foveally and in the right visual field. This provides evidence for enhanced tuning for upright letters in early visual processing. By contrast, we found higher decoding accuracy for inverted letters than for upright letters during and after the N170 component (starting ca.140 msec). These results demonstrate that massive experience with upright letters influences sensory processing, leading to enhanced feature extraction for highly familiar (upright) letter forms at an early stage, followed by enhanced neural discriminability for less familiar (inverted) letter forms at a later stage."

- date: "December 9, 2025 (Tuesday), 4:30 pm–5:30 pm"
  description: "Guest Talk by Prof. Julia Strand (Carleton College), \"Error Prevention in Psychological Research\"."
  abstract: "Everyone makes mistakes. In science, mistakes can occur in many ways: Researchers may transcribe things incorrectly, make typos when writing code to analyze data, forget to do something they intended to, and so forth. These mistakes may simply waste time or require redoing work, but in more serious cases, they can ruin an experiment or lead to false conclusions. In other industries like aviation, medicine, and construction, however, mistakes can be costly or even fatal. What can psychological scientists learn from these disciplines about how we might prevent and detect errors in our own research? In this talk, Strand will draw on lessons from human factors research in other disciplines and present recommendations for how scientists can apply those practices to our labs. This includes incorporating open science practices related to transparency and replicability, developing a lab culture around error prevention, and implementing standardized protocols with the goal of safeguarding our work from future errors."

