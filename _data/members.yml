- name: "Janos Pauli"
  job: "Doctoral Student"
  affiliation: "University of Cologne, Germany"
  research: "Janos is a PhD student working at the Self Learning Systems Lab. He studies the neuro-cognitive aspects of visual letter and word perception by combining computer vision models, neuroimaging data, and machine learning techniques."
  image: "/images/members/pauli.jpg"

- name: "Peter Roßmeier"
