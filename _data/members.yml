- name: "Matilde Ellen Simonetti"
  job: "Doctoral Student"
  affiliation: "RWTH Aachen University, Germany"
  research: "Matilde is currently a PhD student working under the supervision of Tanja Roembke. She is interested in word learning, sometimes with the help of eye-tracking, especially in bilingual populations."
  image: "/images/members/simonetti.jpg"

