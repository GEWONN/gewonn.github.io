- name: "Anna Leung"
  url: "https://msleungyi.github.io/mywebsite/"
  job: "Doctoral Student"
  affiliation: "University of Munich, Germany"
  role: "Journal Club Secretary"
  research: "Anna is a Chinese language teacher in Hong Kong primary and secondary schools by training. In the hope of bridging education and research, she furthered her studies in psychology and the learning sciences. Her work revolves around the subtypes of developmental dyslexia across languages, psychometrics in psycholinguistics, and the philosophy of language."
  image: "/images/members/leung.jpg"

