- name: "Prof. Dr. Xenia Schmalz"
  url: "https://www.xenia-schmalz.net/"
  role: "Founding Member"
  job: "Professor"
  affiliation: "Dresden University of Technology, Germany"
  research: "The ease with which people learn to read depends on characteristics of the language, of the specific words that one is reading, and on the cognitive capacities of the individual. In her research, Xenia examines factors on these levels in order to understand how the environmental factors interact with the cognitive capacities to enable fluent reading."
  image: "/images/members/schmalz.jpg"

- name: "Jun.-Prof. Dr. Benjamin Gagl"
  url: "https://selflearningsystems.uni-koeln.de/"
  role: "Founding Member"
  job: "Assistant Professor"
  affiliation: "University of Munich, Germany"
  research: "When reading, we extract meaning from script. Benjamin uses computational models of the neuro-cognitive processes in reading, evaluated based on behavioural and neuronal data, to improve/develop individualised diagnostics and interventions to increase reading skills."
  image: "/images/members/gagl.png"

- name: "Dr. Jana Hasenäcker"
  url: "https://janahasenacker.wordpress.com/"
  role: "Founding Member"
  job: "Postdoctoral Researcher"
  affiliation: "University of Erfurt, Germany"
  research: "As a postdoc in Psycholinguistics, Jana studies cognitive mechanisms of reading. Her focus is on the use of linguistic units in visual word recognition as well as reading in digital contexts."
  image: "/images/members/hasenäcker.png"

- name: "Dr. Tanja Roembke"
  url: "https://tanjaroembke.net/"
  role: "Founding Member"
  job: "Postdoctoral Researcher"
  affiliation: "RWTH Aachen University, Germany"
  research: "Tanja investigates how people learn new words, read and switch between languages. More recently, she has also been interested in how different language processes interact with memory."
  image: "/images/members/roembke.jpg"

- name: "Dr. Dave Kenneth Tayao Cayado"
  url: "https://sites.google.com/view/dk-cayado/about-me"
  job: "Postdoctoral Researcher"
  affiliation: "Royal Holloway, University of London, UK"
  research: "Dr. Dave Kenneth Tayao Cayado is a {neuro/psycho}linguist working on morphological processing and reading acquisition. He is currently a British Academy Postdoctoral Research Fellow in the Rastle Lab at Royal Holloway, University of London's Department of Psychology."
  image: "/images/members/cayado.jpg"

- name: "Prof. Dušica Filipović Đurđević"
  url: "https://dusicafilipovicdurdevic.net/"
  job: "Full Professor"
  affiliation: "University of Belgrade, Serbia"
  research: "The properties of the cognitive system shape the structure of language. Dušica is trying to understand how language relates to learning and memory by focusing simultaneously on intra-linguistic distributional information and the links between language and perceptual experience. Her research is guided by the desire to describe and understand the immense sensitivity of the cognitive system to probabilities in the environment in general and language in particular."
  image: "/images/members/đurđević.jpg"

- name: "Dr. Wanlu Fu"
  job: "Postdoctoral Researcher"
  affiliation: "University of Cologne, Germany"
  role: "Journal Club Secretary"
  research: "Wanlu is interested in the cognitive and neural mechanisms of reading using eye-tracking, EEG, and computational modeling, focusing on reading difficulties (e.g., dyslexia) across alphabetic (English, German) and logographic (Chinese) scripts. Her work aims to inform evidence-based teaching strategies, early interventions, and diagnostic tools to support reading development."
  image: "/images/members/fu.jpg"

- name: "Dr. Alexandra Schmitterer"
  job: "Postdoctoral Researcher"
  affiliation: "DIPF|Leibniz Institute for Research and Information in Education, Germany"
  research: "Alexandra is currently an associated scientist at the DIPF | Leibniz Institute for Research and Information in Education in Frankfurt. By training, she is a clinical linguist and a psychologist with a specialisation in school psychology. Her research interests focus on reading and language development, learning, emotion as well as teacher education. She is an experienced project coordinator for citizen science projects and gives university courses to student teachers."
  image: "/images/members/schmitterer.png"

- name: "Dr. Jack E. Taylor"
  url: "https://jackedtaylor.github.io/"
  job: "Postdoctoral Researcher"
  affiliation: "Goethe University Frankfurt, Germany"
  role: "Journal Club Secretary"
  research: "Jack is interested in using computational modelling to understand the cognitive and neural bases of word recognition, reading, and language processes. His work focuses on understanding the orthographic and visual processing of letters and words. He is currently based in the Lab for Cognitive Neuroscience at Goethe University Frankfurt with Christian Fiebach."
  image: "/images/members/taylor.jpg"

- name: "Sara Anđelić"
  job: "Doctoral Student"
  affiliation: "University of Belgrade, Serbia"
  research: "Sara is currently conducting her research as a junior research assistant at the Laboratory for Experimental Psychology in Belgrade, Serbia. She is interested in understanding how the idea of the importance of perceptual information postulated by models of embodied cognition fits with the traditionally understood idea of mental representation. In dealing with this issue, she exploits the ambiguity of words."
  image: "/images/members/anđelić.jpg"

