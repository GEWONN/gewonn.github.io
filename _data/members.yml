- name: "Hanna Woloszyn"
  url: "http://www.linkedin.com/in/hannawoloszyn"
  job: "Doctoral Student"
  role: "Student Assistant, TRUST Network"
  affiliation: "University of Cologne, Germany"
  research: "Hanna is currently contributing as a research assistant at the Self Learning Systems Lab at the University of Cologne, where she gets to engage in impactful projects in the field of computational linguistics and cognitive science. She is also a doctoral student with a focus on computational linguistics and discourse studies."
  image: "/images/members/woloszyn.jpg"
